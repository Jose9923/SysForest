name: sysforest-database-viewers

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  phppgadmin:
    image: sysforest-phppgadmin:f35f659-php83-v1
    build:
      context: ./docker/database-viewers
      dockerfile: Dockerfile.phppgadmin
    user: "1000:1000"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18084:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health.php')===false?1:0);"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [backend]

  mongo-express:
    image: sysforest-mongo-express:6b0fc653-node22.23.5
    build:
      context: ./docker/database-viewers
      dockerfile: Dockerfile.mongo-express
    user: "1000:1000"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18085:8081"
    secrets:
      - mongo_express_username
      - mongo_express_password
      - mongo_viewer_password
      - mongo_cookie_secret
      - mongo_session_secret
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/status',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [backend]

networks:
  backend:
    external: true
    name: sysforest-production_backend

# Compose local monta archivos: el instalador conserva dueño/modo del origen.
# Mongo Express: UID1000,0600. phpPgAdmin no recibe secretos ni autologin.
# El contenedor/volumen pgAdmin anterior quedan fuera de Compose para recuperación.
# Ningún secreto administrativo de PostgreSQL/MongoDB se monta en los visores.
secrets:
  mongo_express_username:
    file: ${SYSFOREST_VIEWERS_SECRETS_DIR:-/opt/sysforest/private/database-viewers}/mongo_express_username
  mongo_express_password:
    file: ${SYSFOREST_VIEWERS_SECRETS_DIR:-/opt/sysforest/private/database-viewers}/mongo_express_password
  mongo_viewer_password:
    file: ${SYSFOREST_VIEWERS_SECRETS_DIR:-/opt/sysforest/private/database-viewers}/mongo_viewer_password
  mongo_cookie_secret:
    file: ${SYSFOREST_VIEWERS_SECRETS_DIR:-/opt/sysforest/private/database-viewers}/mongo_cookie_secret
  mongo_session_secret:
    file: ${SYSFOREST_VIEWERS_SECRETS_DIR:-/opt/sysforest/private/database-viewers}/mongo_session_secret
