name: sysforest-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-php-environment: &php-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?Configura APP_URL HTTPS en el archivo privado de producción}
  SESSION_SECURE_COOKIE: "true"
  # Las credenciales administrativas nunca llegan a PHP, tampoco por env_file.
  POSTGRES_PASSWORD: ""
  DB_MIGRATOR_PASSWORD: ""
  MONGO_ROOT_USERNAME: ""
  MONGO_ROOT_PASSWORD: ""
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-sysforest}
  DB_TEST_DATABASE: ""
  DB_USERNAME: ${DB_USERNAME:-sysforest_app}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_CLIENT: phpredis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis

x-php-service: &php-service
  image: ${SYSFOREST_IMAGE:-sysforest-app:production}
  build:
    context: .
    target: production
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  env_file: ${SYSFOREST_ENV_FILE:?Usa --env-file con la configuración privada de producción}
  environment: *php-environment
  working_dir: /var/www/html
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  mem_limit: ${APP_MEMORY_LIMIT:-2g}
  logging: *logging
  volumes:
    - storage_data:/var/www/html/storage
  networks:
    - backend

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sysforest_admin}
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-4g}
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [backend]

  mongodb:
    image: mongo:8.0.34-noble
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1}"]
    environment:
      # Temporal: evita TCMalloc per-CPU en el kernel Ubuntu 7.0.14 (SERVER-131779).
      # Retirar tras validar una versión 8.0 con detección Ubuntu corregida; ver README.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-sysforest_mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      AUDIT_MONGO_DATABASE: ${AUDIT_MONGO_DATABASE:-sysforest_audit}
      AUDIT_MONGO_COLLECTION: ${AUDIT_MONGO_COLLECTION:-activity_logs}
      AUDIT_MONGO_USERNAME: ${AUDIT_MONGO_USERNAME:-sysforest_audit_app}
      AUDIT_MONGO_PASSWORD_FILE: /run/secrets/audit_mongo_password
    secrets: [mongo_root_password, audit_mongo_password]
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/bootstrap.js:/docker-entrypoint-initdb.d/10-audit.js:ro
      - ./docker/mongo/healthcheck.js:/opt/sysforest/mongo-healthcheck.js:ro
    mem_limit: ${MONGO_MEMORY_LIMIT:-2g}
    logging: *logging
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--file", "/opt/sysforest/mongo-healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEMORY_LIMIT:-768m}
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # Preparación y migraciones requieren invocación explícita. No hay seeds automáticos.
  db-init:
    profiles: [maintenance]
    image: postgis/postgis:17-3.5
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/sysforest-production/postgres-bootstrap.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-sysforest_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_MIGRATOR_PASSWORD_FILE: /run/secrets/migrator_password
      DB_DATABASE: ${DB_DATABASE:-sysforest}
      DB_USERNAME: ${DB_USERNAME:-sysforest_app}
      DB_MIGRATOR_USERNAME: ${DB_MIGRATOR_USERNAME:-sysforest_migrator}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD de producción}
    secrets: [postgres_password, migrator_password]
    volumes:
      - ./docker/postgres:/opt/sysforest:ro
      - ./docker/production/postgres-bootstrap.sh:/opt/sysforest-production/postgres-bootstrap.sh:ro
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  migrate:
    <<: *php-service
    profiles: [maintenance]
    restart: "no"
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    environment:
      <<: *php-environment
      DB_USERNAME: ${DB_MIGRATOR_USERNAME:-sysforest_migrator}
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/migrator_password
    secrets: [migrator_password]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    <<: *php-service
    healthcheck:
      test: ["CMD", "sysforest-fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    <<: *php-service
    mem_limit: ${QUEUE_MEMORY_LIMIT:-768m}
    command: ["php", "artisan", "queue:work", "redis", "--sleep=2", "--tries=3", "--timeout=60", "--max-time=3600"]
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/sysforest-process-healthcheck", "queue:work"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *php-service
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-512m}
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/sysforest-process-healthcheck", "schedule:work"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SYSFOREST_HTTP_PORT:-18080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  storage_data:

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.240.0/24
          gateway: 172.28.240.1

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  migrator_password:
    environment: DB_MIGRATOR_PASSWORD
  mongo_root_password:
    environment: MONGO_ROOT_PASSWORD
  audit_mongo_password:
    environment: AUDIT_MONGO_PASSWORD
