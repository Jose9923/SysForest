# Se omiten query strings y referers para no registrar enlaces de invitación/reset.
log_format sysforest_safe '$remote_addr - $request_method $uri $status $body_bytes_sent';

# El DNS interno de Docker permite seguir a app cuando Compose cambia su dirección.
upstream sysforest_php {
    zone sysforest_php 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server app:9000 resolve;
}

server {
    # Este nivel sustituye los logs heredados de la imagen, que incluyen $request y Referer.
    access_log /var/log/nginx/access.log sysforest_safe;

    # Caddy usa network_mode:host y sobrescribe X-Real-IP con remote_host.
    # Solo el gateway de esta red Docker y loopback pueden aportar la dirección real.
    set_real_ip_from 172.28.240.1;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # El único ingreso externo es el proxy HTTPS del host; este puerto es privado.
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_pass sysforest_php;
        fastcgi_read_timeout 65s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # Los assets propios no tienen hash en la URL: cada carga debe revalidarlos.
    # Se conserva la precedencia de los bloqueos PHP y de archivos ocultos.
    location ~* ^/(css|js)/.*\.(css|js)$ {
        try_files $uri =404;
        expires -1;
    }
}
