Listen 8080
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    ErrorLog /dev/null
    CustomLog /dev/null common
    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <DirectoryMatch "/var/www/html/(conf|classes|lang|plugins)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(?:HISTORY|INSTALL|LICENSE|CREDITS|DEVELOPERS|TODO|TRANSLATORS|BUGS|FAQ|.*\.inc\.php|.*\.patch)$">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Header always set Cache-Control "no-store"
</VirtualHost>
