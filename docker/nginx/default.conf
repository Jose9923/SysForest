# Se omiten query strings y referers para no registrar enlaces de invitación/reset.
log_format sysforest_safe '$remote_addr - $request_method $uri $status $body_bytes_sent';
access_log /var/log/nginx/access.log sysforest_safe;

# El DNS interno de Docker permite seguir a app cuando Compose cambia su dirección.
upstream sysforest_php {
    zone sysforest_php 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server app:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass sysforest_php;
        fastcgi_read_timeout 65s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
